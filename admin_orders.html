<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Orders - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style/admin.css">
    <script src="/js/admin-theme.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/img/header.svg" alt="Itqan" class="logo">
                <h3>Admin Panel</h3>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/admin/dashboard"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li class="active"><a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                    <li><a href="/admin/services"><i class="fas fa-concierge-bell"></i> Services</a></li>
                    <li><a href="/admin/users"><i class="fas fa-users"></i> Users</a></li>
                    <li><a href="/admin/messages"><i class="fas fa-envelope"></i> Messages</a></li>
                    <li><a href="/admin/settings"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="/index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Manage Orders</h2>
                <div class="user-info">
                    <div class="profile">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=06b6d4&color=fff" alt="Admin">
                        <span>Super Admin</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="recent-orders-section">
                    <div class="section-header">
                        <h2>Order List</h2>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Customer</th>
                                    <th>Service</th>
                                    <th>Amount</th>
                                    <th>Sample File</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body">
                                <!-- Dynamic Content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchOrders);

        const API_BASE_URL = ''; // Relative path since we are serving from the backend

        function fetchOrders() {
            fetch(API_BASE_URL + '/api/orders', { credentials: 'include' })
                .then(res => res.json())
                .then(orders => {
                    const tbody = document.getElementById('orders-table-body');
                    tbody.innerHTML = '';
                    orders.forEach(order => {
                        const tr = document.createElement('tr');
                        const fileLink = order.file ? `<a href="${order.file}" target="_blank" style="color: #06b6d4;">View File</a>` : 'No File';

                        tr.innerHTML = `
                            <td>${order.customer}</td>
                            <td>${order.service}</td>
                            <td>৳ ${order.amount}</td>
                            <td>${fileLink}</td>
                            <td>
                                <select onchange="updateStatus(${order.id}, this.value)" style="padding: 4px; border-radius: 4px;">
                                    <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </td>
                            <td>
                                <button onclick="deleteOrder(${order.id})" class="action-btn" style="color: #ef4444;"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function updateStatus(id, newStatus) {
            fetch(`${API_BASE_URL}/api/orders/${id}/status`, {
                credentials: 'include',
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
                .then(res => res.json())
                .then(() => alert('Status Updated'))
                .catch(() => alert('Error updating status'));
        }

        function deleteOrder(id) {
            if (confirm('Delete this order?')) {
                fetch(`${API_BASE_URL}/api/orders/${id}`, { method: 'DELETE', credentials: 'include' })
                    .then(() => fetchOrders());
            }
        }
    </script>
</body>

</html>
