<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Itqan Creative</title>
    <!-- Using Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style/auth.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Left Side: Welcome -->
        <div class="welcome-section" style="background: linear-gradient(135deg, #0f172a 0%, #000000 100%);">
            <a href="/index.html" class="home-link">
                <i class="fas fa-arrow-left"></i> Home
            </a>

            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>

            <div class="content">
                <h2>Admin Portal</h2>
                <p>Manage Itqan Creative<br>
                    Secure area for administrators only.</p>
            </div>
        </div>

        <!-- Right Side: Sign In Form -->
        <!-- Right Side: Sign In Form -->
        <div class="form-section">
            <div class="form-header">
                <h2>Admin Sign In</h2>
                <p>Please enter your credentials</p>
            </div>

            <form id="loginForm">
                <!-- Username Input -->
                <div class="form-group">
                    <span class="icon"><i class="fas fa-user-shield"></i></span>
                    <input type="text" id="username" placeholder="Admin Username" required>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="show-pass">SHOW</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" id="forgot-password">Forgot Password?</a>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="btn btn-primary"
                    style="background: linear-gradient(135deg, #FF0000, #990000); border: none;">Admin Login</button>

                <div id="error-msg" style="color: red; text-align: center; margin-top: 1rem; display: none;"></div>

                <!-- Footer Note -->
                <div class="nav-links" style="margin-top: 1.5rem;">
                    <i class="fas fa-lock"></i> Restricted Access
                </div>
            </form>
        </div>
    </div>

    <!-- Recovery Modal -->
    <div id="recovery-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: #1e293b; padding: 2rem; border-radius: 10px; max-width: 400px; width: 90%; text-align: center; color: white; border: 1px solid #334155;">
            <h3 style="margin-bottom: 1rem;"><i class="fas fa-key"></i> Password Recovery</h3>
            <p id="recovery-text" style="color: #94a3b8; margin-bottom: 2rem;">Loading...</p>
            <button onclick="document.getElementById('recovery-modal').style.display='none'" class="btn btn-primary"
                style="background: #334155; border: none; padding: 0.5rem 1.5rem;">Close</button>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        document.querySelector('.show-pass').addEventListener('click', function () {
            const input = this.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = 'HIDE';
            } else {
                input.type = 'password';
                this.textContent = 'SHOW';
            }
        });

        // Forgot Password Handler
        document.getElementById('forgot-password').addEventListener('click', async (e) => {
            e.preventDefault();
            const modal = document.getElementById('recovery-modal');
            const text = document.getElementById('recovery-text');

            modal.style.display = 'flex';

            try {
                const res = await fetch('/api/auth/recovery');
                const data = await res.json();
                text.innerText = data.info;
            } catch (err) {
                text.innerText = 'Unable to fetch recovery info. Please try again.';
            }
        });

        // Login Handler
        const API_BASE_URL = 'http://localhost:3000';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            btn.innerText = 'Checking...';
            btn.disabled = true;

            try {
                const res = await fetch(API_BASE_URL + '/api/auth/login', {
                    credentials: 'include',
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'admin', username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error';
                errorMsg.style.display = 'block';
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
